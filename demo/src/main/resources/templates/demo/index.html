<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(content=~{::section})}">

<!--
  index.html
  - PhotoProject 검증용 메인 화면
  - Postman + Thymeleaf 두 방식으로 API 동작을 검증하기 위한 진입점
  - 공통 레이아웃(base.html)을 사용하고,
    아래 <section> 전체가 content 슬롯으로 전달.
-->

<section>
    <h1>PhotoProject 검증용 홈</h1>

    <p>
        CRUD기능과 사진 업로드 기능이 존재하는 <br>1인개발 PhotoProject입니다.
    </p>

    <hr/>

    <!-- 인증 관련 -->
    <section>
        <h2>🔐 인증(Authentication)</h2>
        <!--로그인 상태 표시-->
        <div th:if="${isLogin}">
            <p>
                로그인 상태: <strong th:text="${username}">username</strong>
            </p>

        </div>
        <!--비로그인 상태-->
        <div th:unless="${isLogin}">
            <ul>
                <li><a th:href="@{/ui/demo/login}">로그인 페이지</a></li>
                <li><a th:href="@{/ui/auth/signup}">회원가입 페이지</a></li>
            </ul>

        </div>
    </section>

    <hr/>

    <!-- 게시글 관련 -->
    <section>
        <h2>📝 게시글(Post)</h2>
        <ul>
            <li><a th:href="@{/ui/posts}">게시글 목록 조회</a></li>
            <li><a th:href="@{/ui/posts/write}">게시글 작성</a></li>
        </ul>

    </section>

    <hr/>

    <!-- 보안 정책 -->
    <section>
        <h2>🛡️ 보안 정책 요약</h2>
        <ul>
            <li>비로그인 사용자 접근 → 401</li>
            <li>권한 부족 접근 → 403</li>
        </ul>
    </section>

    <hr/>

    <!-- 안내 -->
    <section>
        <p>
            photoProject는 <strong>갤러리 게시판</strong> 목적의 API 프로젝트이며,<br/>
            혼자 독학하며 점차 업데이트중에 있습니다.
        </p>
    </section>

</section>

</html>
